- name: "Create shared installation data directory for CMF MES"
  hosts: windows
  gather_facts: true
  become: false
  vars_files:
    - ../values.yml
    - ../secrets.yml
  vars:
    share_path: "C:\\shares\\"
    share_name: "shares"
  
  tasks:
    - name: Create install_dir directory
      ansible.windows.win_file:
        # path: "{{ cmf.environment.install_data_path }}"
        path: "{{ cmf.environment.install_data_path }}"
        state: directory

    - name: Set NTFS permissions with dedicated user
      ansible.windows.win_acl:
        path: "{{ share_path }}"
        user: "{{ item.user }}"
        rights: "{{ item.rights }}"
        type: allow
        state: present
        inherit: ContainerInherit, ObjectInherit
        propagation: None
      loop:
        - { user: "{{ db_username }}", rights: "FullControl" }
        - { user: "SYSTEM", rights: "FullControl" }
        - { user: "Administrators", rights: "FullControl" }

    - name: Create SMB share with specific user access
      ansible.windows.win_share:
        name: "{{ share_name }}"
        path: "{{ share_path }}"
        state: present
        full: "{{ db_username }}"
        change: ""
        read: ""
        description: "Kubernetes SMB CSI Share"
        caching_mode: None

    - name: Enable SMB firewall rules
      community.windows.win_firewall_rule:
        name: "{{ item.name }}"
        localport: "{{ item.port }}"
        action: allow
        direction: in
        protocol: tcp
        state: present
        enabled: yes
      loop:
        - { name: "SMB-In-TCP", port: "445" }
        - { name: "NetBIOS-In-TCP", port: "139" }

    - name: Enable File and printer sharing
      ansible.windows.win_shell: Get-NetFirewallRule -DisplayGroup "File and Printer Sharing" | Enable-NetFirewallRule

    - name: Verify SMB service is running
      ansible.windows.win_service:
        name: LanmanServer
        state: started
        start_mode: auto

    - name: Test SMB share connectivity
      ansible.windows.win_shell: |
        Test-Path "\\localhost\{{ share_name }}"
      register: share_test
      changed_when: false
      failed_when: share_test.stdout.strip() != "True"

