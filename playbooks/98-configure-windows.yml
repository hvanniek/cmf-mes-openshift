---
# Now let's continue on the windows host
- name: "Install and configure database for CMF on Windows"
  hosts: windows
  become: false
  gather_facts: true
  vars_files:
    - ../values.yml
    - ../secrets.yml
  tasks:
    - name: Change the hostname to 
      ansible.windows.win_hostname:
        name: "{{ cmf_db_server_name }}"
      register: res

    - name: Reboot if required
      ansible.windows.win_reboot:
      when: res.reboot_required

    # - name: create user account for db on windows
    #   # Content suggestion provided by Ansible Lightspeed
    #   ansible.windows.win_user:
    #     name: "{{ db_username }}"
    #     password: "{{ db_password }}"
    #     groups:
    #       - Users
    #       - Administrators
    #     state: present

    - name: Create a directory if it does not exist
      ansible.windows.win_file:
        path: 'C:\temp\'
        state: directory
      register: _outputDir

    - name: Check if SQL Server is already installed
      ansible.windows.win_shell: |
        $instance = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server' -ErrorAction SilentlyContinue
        if ($instance -and $instance.InstalledInstances) {
          Write-Output "INSTALLED"
          exit 0
        } else {
          Write-Output "NOT_INSTALLED"
          exit 1
        }
      register: sql_check
      failed_when: false
      changed_when: false
    - block:
####### SQL server setup 
      - name: Populate the SQL server templates
        ansible.builtin.template:
          src: ../templates/dbconfigfile.ini.j2
          dest: 'C:\temp\Configfile.ini'

      - name: Download the SQL server installer
        ansible.windows.win_get_url:
          url: 'https://download.microsoft.com/download/4/1/b/41b9a8c3-c2b4-4fcc-a3d5-62feed9e6885/SQL2022-SSEI-Eval.exe?culture=en-us&country=us'
          dest: 'C:\temp\'

      # - name: Install SQL server on windows
      #   # Content suggestion provided by Ansible Lightspeed
      #   ansible.windows.win_package:
      #     path: 'C:\temp\SQL2022-SSEI-Eval.exe'
      #     product_id: 'Microsoft SQL Server SQL2022'
      #     arguments:
      #       - /Q
      #       - /v
      #       - /CONFIGURATIONFILE='C:\temp\Configfile.ini'
      #       - /IACCEPTSQLSERVERLICENSETERMS
      #       - /MEDIAPATH='C:\temp'
                #   register: sql_server_install_result


      - name: Install SQL server on windows
        ansible.windows.win_shell:  'C:\temp\SQL2022-SSEI-Eval.exe /Q /v /CONFIGURATIONFILE="C:\temp\Configfile.ini" /IACCEPTSQLSERVERLICENSETERMS /MEDIAPATH="C:\temp"'

  # Change registry ports
      - name: Move named instance registry to set sql server port
        ansible.windows.win_regedit:
          path: 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\MSSQL16.ONLINE\MSSQLServer\SuperSocketNetLib\Tcp\IPAll'
          name: TcpPort
          data: 1433
      - name: Disable dynamic ports in registry
        ansible.windows.win_regedit:
          path: 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\MSSQL16.ONLINE\MSSQLServer\SuperSocketNetLib\Tcp\'
          name: TcpDynamicPorts
          data: ''

      - name: Restart SQL service
        ansible.windows.win_service:
          name: "SQL Server (ONLINE)"
          state: restarted

      - name: Set Firewall rules to allow Database communication
        community.windows.win_firewall_rule:
          name: "{{ item.name }}"
          localport: "{{ item.port }}"
          action: allow
          direction: in
          protocol: "{{ item.protocol }}"
          state: present
          enabled: 
        loop:
          - { name: "MS SQL", port: "1433", protocol: "tcp" }
          - { name: "MS SQL Mgnt", port: "139", protocol: "udp"}
          - { name: "MS SQL Analysis Services", port: "2383", protocol: "tcp"}
          - { name: "MS SQL Reporting Services", port: "80, 443", protocol: "tcp" }
        
      # - name: Firewall rule to allow Database management communication
      #   community.windows.win_firewall_rule:
      #     name: MS SQL Mgnt
      #     localport: 1434
      #     action: allow
      #     direction: in
      #     protocol: UDP
      #     state: present
      #     enabled: true

      # - name: Firewall rule to allow Report Server communication
      #   community.windows.win_firewall_rule:
      #     name: MS SQL Analysis Services
      #     localport: 2383
      #     action: allow
      #     direction: in
      #     protocol: tcp
      #     state: present
      #     enabled: true
      when: sql_check.rc == 1

####### SQL Reporting Services setup 
    - name: Check if SQL Server Reporting Services is already installed
      ansible.windows.win_shell: |
        $ssrs = Get-WmiObject -Class Win32_Product -Filter "Name LIKE '%SQL Server Reporting Services%'" -ErrorAction SilentlyContinue
        if ($ssrs) {
          Write-Output "SSRS_INSTALLED"
          exit 0
        } else {
          Write-Output "SSRS_NOT_INSTALLED"
          exit 1
        }
      register: ssrs_check
      failed_when: false
      changed_when: false

    - block:
      - name: Download the SQL Reporting Services installer
        ansible.windows.win_get_url:
          url: 'https://download.microsoft.com/download/1/a/a/1aaa9177-3578-4931-b8f3-373b24f63342/SQLServerReportingServices.exe'
          dest: 'C:\temp\'

      - name: Install SQL Server Reporting Services
        ansible.windows.win_command:
          cmd: 'C:\temp\SQLServerReportingServices.exe /quiet /IAcceptLicenseTerms'

        #  ansible.windows.win_package:
        #   path: 'https://download.microsoft.com/download/1/a/a/1aaa9177-3578-4931-b8f3-373b24f63342/SQLServerReportingServices.exe'
        #   product_id: '{C72EBF99-ED51-45FC-804B-82B1AC8923E7}'
        #   arguments:
        #     - /IAcceptLicenseTerms
        #     - /quiet

      - name: Configure SSRS
        ansible.windows.win_command:
          cmd: >-
            "C:\Program Files\Microsoft SQL Server Reporting Services\Shared Tools\RSConfig.exe"
            -c
            -s "{{ cmf_db_server_name }}\ONLINE"
            -i SSRS
            -d ReportServer
            -a SQL
            -u "{{ db_host_path }}\{{ db_username }}"
            -p "{{ admin_password }}"
            -t

      - name: Enable windows basic auth for report server
        community.windows.win_xml:
          path: 'C:\Program Files\Microsoft SQL Server Reporting Services\SSRS\ReportServer\rsreportserver.config'
          xpath: //Configuration/Authentication/AuthenticationTypes
          fragment: <RSWindowsBasic />

      # - name: Setup WebServerWebServices
      #   community.windows.win_xml:
      #     path: 'C:\Program Files\Microsoft SQL Server Reporting Services\SSRS\ReportServer\rsreportserver.config'
      #     xpath: //Configuration/URLReservations/Application[Name="ReportServerWebService"]
      #     fragment: |
      #           <URLs>
      #             <URL>
      #               <UrlString>http://+:80</UrlString>
      #               <AccountSid>S-1-5-80-4050220999-2730734961-1537482082-519850261-379003301</AccountSid>
      #               <AccountName>NT SERVICE\SQLServerReportingServices</AccountName>
      #             </URL>
      #           </URLs>
      # - name: Setup WebServerWebServices
      #   community.windows.win_xml:
      #     path: 'C:\Program Files\Microsoft SQL Server Reporting Services\SSRS\ReportServer\rsreportserver.config'
      #     xpath: //Configuration/URLReservations/Application[Name="ReportServerWebApp"]
      #     fragment: |
      #           <URLs>
      #             <URL>
      #               <UrlString>http://+:80</UrlString>
      #               <AccountSid>S-1-5-80-4050220999-2730734961-1537482082-519850261-379003301</AccountSid>
      #               <AccountName>NT SERVICE\SQLServerReportingServices</AccountName>
      #             </URL>
      #           </URLs>

      - name: Restart SSRS service
        ansible.windows.win_service:
          name: "SQL Server Reporting Services"
          state: restarted

      #   register: sql_server_install_result
      #   failed_when: sql_server_install_result.rc != 0
      #   changed_when: sql_server_install_result.rc == 0
      # - name: Firewall rule to allow Report Server communication
      #   community.windows.win_firewall_rule:
      #     name: MS SQL Reporting Services
      #     localport: 80,443
      #     action: allow
      #     direction: in
      #     protocol: tcp
      #     state: present
      #     enabled: true

      when: ssrs_check.rc == 1

    - name: Install NFS Client feature
      ansible.windows.win_feature:
        name: NFS-Client
        state: present
      register: nfs_install
      
    - name: Reboot if required
      ansible.windows.win_reboot:
      when: nfs_install.reboot_required

